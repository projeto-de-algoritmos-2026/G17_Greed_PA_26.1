{% load static %}

{% block estilos %}
<style>
  .dinheiro-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2vh;
  }

  .dinheiro-card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 200px;
    aspect-ratio: 4 / 3;
  }

  .dinheiro-img {
    display: block;
    height: 100%;
    max-height: 150px;
  }

  .contador-wrapper {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .contador-valor {
    font-family: "Tasty Matcha", sans-serif;
    font-size: clamp(2rem, 4vw, 4rem);
    color: #A34B17;
    min-width: 3ch;
    text-align: center;
    text-shadow:
      -4px -4px 0 #FBE7D6,  4px -4px 0 #FBE7D6,
      -4px  4px 0 #FBE7D6,  4px  4px 0 #FBE7D6,
       0px -4px 0 #FBE7D6,  0px  4px 0 #FBE7D6,
      -4px  0px 0 #FBE7D6,  4px  0px 0 #FBE7D6;
  }
</style>
{% endblock %}

<div class="dinheiro-area">

  <div class="dinheiro-card" id="dinheiro-card">
    <img
      class="dinheiro-img"
      id="dinheiro-img"
      src=""
      alt=""
    />
  </div>

  <div class="contador-wrapper">
    {% include 'caixa/components/btn_play.html' with texto="—" onclick="alterarQtd(-1)" %}
    <span class="contador-valor" id="contador-valor">0</span>
    {% include 'caixa/components/btn_play.html' with texto="+" onclick="alterarQtd(1)" %}
  </div>

</div>
