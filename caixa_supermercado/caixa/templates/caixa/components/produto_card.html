{% load static %}

{% block estilos %}
<style>
  .produto-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2vh;
  }

  .produto-card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 400px;
    aspect-ratio: 4 / 3;
  }

  .produto-img {
    display: block;
    height: 100%;
    max-height: 300px;
  }

  .produto-tag {
    container-type: inline-size;
    position: absolute;
    right: 50%;
    top: 50%;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: -1;
  }

  .produto-tag-img {
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .produto-tag-texto {
    position: absolute;
    left: 10%;
    bottom: 30%;
    z-index: 1;
    color: #A34B17;
    font-family: "Tasty Matcha", sans-serif;
    font-size: 14cqw;
    font-style: normal;
    font-weight: 400;
    line-height: normal;
    letter-spacing: -6px;
    transform: rotate(-39.442deg);
  }

  .contador-wrapper {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .contador-valor {
    font-family: "Tasty Matcha", sans-serif;
    font-size: clamp(2rem, 4vw, 4rem);
    color: #A34B17;
    min-width: 3ch;
    text-align: center;
    text-shadow:
      -4px -4px 0 #FBE7D6,  4px -4px 0 #FBE7D6,
      -4px  4px 0 #FBE7D6,  4px  4px 0 #FBE7D6,
       0px -4px 0 #FBE7D6,  0px  4px 0 #FBE7D6,
      -4px  0px 0 #FBE7D6,  4px  0px 0 #FBE7D6;
  }
</style>
{% endblock %}

<div class="produto-area">

  <div class="produto-card" id="produto-card">
    <img
      class="produto-img"
      id="produto-img"
      src=""
      alt=""
    />
    <div class="produto-tag">
      <img
        class="produto-tag-img"
        src="{% static 'caixa/img/tag.svg' %}"
        alt=""
        aria-hidden="true"
      />
      <span class="produto-tag-texto" id="produto-preco"></span>
    </div>
  </div>

  <div class="contador-wrapper">
    {% include 'caixa/components/btn_play.html' with texto="—" onclick="alterarQtd(-1)" %}
    <span class="contador-valor" id="contador-valor">0</span>
    {% include 'caixa/components/btn_play.html' with texto="+" onclick="alterarQtd(1)" %}
  </div>

</div>
